services:
  app:
    build: .
    # Keep running 24/7: auto-restart on crash and when Docker/host restarts.
    restart: unless-stopped
    # Host port is configurable (default 8000) to avoid clashes on shared hosts.
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    # The host's primary resolver (1.214.68.2) is unreachable from inside the
    # container, so Docker's embedded resolver burned ~4s per lookup timing out
    # before it fell back. Point at resolvers the container can actually reach.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stock
      POSTGRES_PASSWORD: stock
      POSTGRES_DB: stock
    # No host port published: the app reaches the DB over the internal compose
    # network (db:5432), so this won't clash with other Postgres on the host.
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stock -d stock"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
